<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover — agar env(safe-area-inset-*) di UI kamera berfungsi benar -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<title>Portal Pegawai — BBWS Brantas</title>
<link rel="icon" type="image/png" href="assets/img/logo-symbol.png">
<link rel="apple-touch-icon" href="assets/img/logo-symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
/* CATATAN: CSS .tb-out dihapus — logout kini via action sheet profil */

/* ============================================================
   ★ ACTION SHEET PROFIL (iOS bottom sheet)
   ============================================================ */
.me-sheet-backdrop{position:fixed;inset:0;z-index:12000;background:rgba(0,0,0,.4);
  backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;visibility:hidden;transition:.25s}
.me-sheet-backdrop.open{opacity:1;visibility:visible}
.me-sheet{width:100%;max-width:420px;background:#F2F2F7;border-radius:22px 22px 0 0;
  padding:8px 10px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:.3s cubic-bezier(.32,.72,0,1)}
.me-sheet-backdrop.open .me-sheet{transform:translateY(0)}
.me-sheet-grip{width:40px;height:5px;border-radius:99px;background:#C7C7CC;margin:4px auto 10px}
.me-sheet-head{display:flex;align-items:center;gap:10px;padding:8px 10px 12px}
.me-sheet-head img{width:44px;height:44px;border-radius:50%;object-fit:cover;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.me-sheet-head b{display:block;font:700 14.5px -apple-system,sans-serif;color:#000}
.me-sheet-head small{font:600 11px -apple-system,sans-serif;color:#8E8E93;text-transform:capitalize}
.me-sheet-btn{width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:0;
  border-radius:14px;padding:14px;margin-bottom:8px;font:600 15px -apple-system,sans-serif;
  color:#000;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.15s}
.me-sheet-btn:active{background:#E5E5EA}
.me-sheet-btn svg{width:19px;height:19px;color:#1E3A8A}
.me-sheet-btn.danger{color:#C41E18}
.me-sheet-btn.danger svg{color:#C41E18}
.me-sheet-cancel{width:100%;border:0;background:#fff;border-radius:14px;padding:14px;
  font:700 15px -apple-system,sans-serif;color:#007AFF;cursor:pointer}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside>
  <div class="brand">
    <img src="assets/img/logo-symbol.png" alt="Logo PUPR" width="40" height="40"
         style="border-radius:10px;object-fit:cover"
         onerror="this.style.display='none';document.getElementById('brandSvgSide').style.display=''">
    <svg id="brandSvgSide" viewBox="0 0 44 44" width="40" height="40" style="display:none">
      <rect width="44" height="44" rx="13" fill="#1E3A8A"/>
      <path d="M22 8.5c3.6 4.3 6 7.6 6 10.6a6 6 0 1 1-12 0c0-3 2.4-6.3 6-10.6z" fill="#FBB917"/>
      <path d="M10 33.5c2.2-2.6 4.4-2.6 6.6 0s4.4 2.6 6.6 0 4.4-2.6 6.6 0 4.4 2.6 6.6 0" stroke="#FBB917" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="brand-t"><b>BBWS Brantas</b><small>Kementerian PUPR</small></div>
  </div>
  <p class="nav-label">Menu Utama</p>
  <nav id="sidebarNav">
    <button class="nav-btn on" data-page="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button>
    <button class="nav-btn" data-page="presensi"><i data-lucide="fingerprint"></i>Presensi</button>
    <button class="nav-btn" data-page="verifikasi" id="navVerifikasi"><i data-lucide="clipboard-check"></i>Verifikasi</button>
    <button class="nav-btn" data-page="monitoring" id="navMonitoring"><i data-lucide="eye"></i>Monitoring</button>
    <button class="nav-btn" data-page="koordinasi" id="navKoordinasi"><i data-lucide="handshake"></i>Koordinasi</button>
    <button class="nav-btn" data-page="laporan"><i data-lucide="file-text"></i>Laporan</button>
    <button class="nav-btn" data-page="raport"><i data-lucide="award"></i>Raport</button>
    <button class="nav-btn" data-page="biodata"><i data-lucide="user-round"></i>Biodata</button>
    <button class="nav-btn" data-page="admin" id="navAdmin" style="display:none"><i data-lucide="settings"></i>Admin</button>
  </nav>
  <div class="side-foot">
    <!-- ★ user = pemicu action sheet (tanpa data-page) -->
    <button class="side-user" id="meChipSide" type="button">
      <img class="js-avatar" src="https://img.icons8.com/3d-fluency/256/user-male-circle.png" alt="">
      <div><b class="js-nama">Loading...</b><small class="js-role">—</small></div>
    </button>
    <!-- trigger logout tersembunyi (dipakai fallback action sheet) -->
    <button class="side-out" id="btnLogout" style="display:none"><i data-lucide="log-out"></i>Keluar</button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <header class="topbar">
    <div class="tb-in">
      <div class="tb-brand-m">
        <img src="assets/img/logo-symbol.png" alt="Logo PUPR" width="34" height="34"
             style="border-radius:9px;object-fit:cover"
             onerror="this.style.display='none';document.getElementById('brandSvgTop').style.display=''">
        <svg id="brandSvgTop" viewBox="0 0 44 44" width="34" height="34" style="display:none">
          <rect width="44" height="44" rx="12" fill="#1E3A8A"/>
          <path d="M22 8.5c3.6 4.3 6 7.6 6 10.6a6 6 0 1 1-12 0c0-3 2.4-6.3 6-10.6z" fill="#FBB917"/>
        </svg>
        <div><b>BBWS Brantas</b><small>Portal Pegawai</small></div>
      </div>
      <div class="tb-title">
        <span class="kicker" id="tbKicker">Portal Pegawai</span>
        <h2 id="tbTitle">Dashboard</h2>
      </div>
      <div class="tb-right">
        <span class="tb-time" id="tbTime">—</span>
        <!-- ★ chip profil = pemicu action sheet (tanpa data-page) -->
        <button class="me-chip" id="meChipTop" type="button">
          <img class="js-avatar" src="https://img.icons8.com/3d-fluency/256/user-male-circle.png" alt="">
          <span class="js-nama">Loading...</span>
        </button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <main id="pageContainer">
      <div style="text-align:center;padding:60px;color:var(--muted)">
        <div style="display:inline-block;width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite"></div>
        <p style="margin-top:12px;font-weight:600">Memuat halaman...</p>
      </div>
    </main>
    <footer style="text-align:center;font:600 12.5px var(--font);color:var(--muted);padding:32px 0 48px">
      Balai Besar Wilayah Sungai Brantas · Direktorat Jenderal Sumber Daya Air · Kementerian PUPR
    </footer>
  </div>
</div>

<!-- BOTTOM NAV (isi asli dibangun dinamis oleh buildBnav() di app.js) -->
<nav id="bnav" aria-label="Navigasi utama">
  <button class="bnav-item" data-page="dashboard">
    <span class="bnav-ic"><i data-lucide="layout-dashboard"></i></span>
    <span>Dashboard</span>
  </button>
  <button class="bnav-item" data-page="monitoring">
    <span class="bnav-ic"><i data-lucide="eye"></i></span>
    <span>Monitoring</span>
  </button>
  <button class="bnav-fab" data-page="presensi" aria-label="Presensi">
    <i data-lucide="fingerprint"></i>
  </button>
  <button class="bnav-item" data-page="verifikasi">
    <span class="bnav-ic"><i data-lucide="clipboard-check"></i></span>
    <span>Verifikasi</span>
  </button>
  <button class="bnav-item" data-page="biodata">
    <span class="bnav-ic"><i data-lucide="user-round"></i></span>
    <span>Profil</span>
  </button>
</nav>

<div id="toasts"></div>

<!-- ★ ACTION SHEET PROFIL — Lihat Profil / Logout -->
<div id="meSheet" class="me-sheet-backdrop">
  <div class="me-sheet">
    <div class="me-sheet-grip"></div>
    <div class="me-sheet-head">
      <img class="js-avatar" src="https://img.icons8.com/3d-fluency/256/user-male-circle.png" alt="">
      <div><b class="js-nama">—</b><small class="js-role">—</small></div>
    </div>
    <button type="button" class="me-sheet-btn" id="meBtnProfil">
      <i data-lucide="user-round"></i> Lihat Profil
    </button>
    <button type="button" class="me-sheet-btn danger" id="meBtnLogout">
      <i data-lucide="log-out"></i> Logout
    </button>
    <button type="button" class="me-sheet-cancel" id="meBtnCancel">Batal</button>
  </div>
</div>

<!-- MODAL FOTO GLOBAL -->
<div id="fotoModal">
  <div class="modal-bg" onclick="closeFotoModal()"></div>
  <div class="foto-card">
    <div class="foto-head">
      <h4 id="fotoModalTitle">Foto</h4>
      <button class="modal-close" onclick="closeFotoModal()"><i data-lucide="x"></i></button>
    </div>
    <div class="foto-body">
      <img id="fotoModalImg" src="" alt="">
    </div>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/camera.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/presensi-full.js"></script>
<script src="assets/js/verifikasi.js"></script>
<script src="assets/js/monitoring.js"></script>
<script src="assets/js/pengajuan.js"></script>
<script src="assets/js/raport.js"></script>
<script src="assets/js/koordinasi.js"></script>
<script src="assets/js/laporan.js"></script>
<script src="assets/js/admin.js"></script>

<!-- ★ ACTION SHEET PROFIL — harus SEBELUM app.js agar delegasi ini jalan duluan -->
<script>
(function(){
  function openMeSheet(){ document.getElementById('meSheet')?.classList.add('open'); }
  function closeMeSheet(){ document.getElementById('meSheet')?.classList.remove('open'); }

  document.addEventListener('click', function(e){
    // 1) klik chip profil (topbar / sidebar) → buka sheet, BLOK router app.js
    if (e.target.closest('#meChipTop, #meChipSide')) {
      e.preventDefault();
      e.stopImmediatePropagation();
      openMeSheet();
      return;
    }
    // 2) tutup: klik backdrop / grip / Batal
    if (e.target.id === 'meSheet' || e.target.closest('.me-sheet-grip') ||
        e.target.closest('#meBtnCancel')) { closeMeSheet(); return; }
    // 3) Lihat Profil
    if (e.target.closest('#meBtnProfil')) {
      closeMeSheet();
      document.querySelector('.nav-btn[data-page="biodata"]')?.click()
        || document.querySelector('.bnav-item[data-page="biodata"]')?.click();
      return;
    }
    // 4) Logout → pakai window.logout() bila ada, else klik trigger tersembunyi
    if (e.target.closest('#meBtnLogout')) {
      closeMeSheet();
      if (typeof window.logout === 'function') window.logout();
      else document.getElementById('btnLogout')?.click();
    }
  });
  console.log('[me-sheet] action sheet profil aktif');
})();
</script>

<script src="assets/js/app.js"></script>
</body>
</html>
