<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<!-- ★ PATCH: viewport-fit=cover (konsisten dgn app.html) + theme-color -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<title>Login — Portal Pegawai BBWS Brantas</title>
<!-- ★ TAMBAHAN: favicon logo resmi -->
<link rel="icon" type="image/png" href="assets/img/logo-symbol.png">
<link rel="apple-touch-icon" href="assets/img/logo-symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FA;--card:#FFF;--line:#E2E8F0;--line-soft:#F1F5F9;
  --ink:#1E3A8A;--ink-2:#334155;--muted:#64748B;
  --yellow:#FBB917;--yellow-soft:#FEF3C7;
  --blue:#2563EB;--blue-soft:#DBEAFE;--blue-dark:#1D4ED8;
  --red:#DC2626;--red-soft:#FEE2E2;
  --radius:24px;--font:'Plus Jakarta Sans',sans-serif;
  --shadow:0 1px 2px rgba(30,58,138,.06),0 10px 28px -14px rgba(30,58,138,.12);
  --shadow-lg:0 18px 48px -16px rgba(30,58,138,.24);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:500 15px/1.55 var(--font);background:linear-gradient(135deg,#1E3A8A 0%,#1D4ED8 100%);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px}
.login-card{background:#fff;border-radius:32px;padding:44px 40px 36px;width:100%;max-width:440px;
  box-shadow:var(--shadow-lg);border-top:6px solid var(--yellow);animation:cardIn .6s cubic-bezier(.2,1.2,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.95)}}
.login-brand{text-align:center;margin-bottom:32px}
/* ★ PATCH: selector svg → img (logo resmi) */
.login-brand img{max-width:230px;height:auto;margin-bottom:16px}
.login-brand h1{font:800 22px var(--font);color:var(--ink);margin-bottom:6px}
.login-brand p{font:600 12px var(--font);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.field label{font:800 11.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.field input{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:500 15px var(--font);background:#fff;transition:.15s;width:100%}
.field input:focus{border-color:var(--blue);outline:3px solid rgba(37,99,235,.15)}
.field .hint{font:500 11.5px var(--font);color:var(--muted)}
/* ★ TAMBAHAN: wrapper password + toggle */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:48px}
.pw-toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border:0;border-radius:10px;background:transparent;
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.15s}
.pw-toggle:hover{background:var(--line-soft);color:var(--ink-2)}
.pw-toggle svg{width:19px;height:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px var(--font);padding:15px 24px;border-radius:99px;border:1.5px solid var(--ink);background:var(--ink);color:#FFF;transition:.2s;width:100%;cursor:pointer}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 24px -10px rgba(30,58,138,.6);background:var(--blue-dark);border-color:var(--blue-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{display:none;background:var(--red-soft);color:#991B1B;padding:14px 16px;border-radius:14px;margin-bottom:20px;font:600 13.5px var(--font);border-left:4px solid var(--red);align-items:center;gap:10px}
.error-msg.show{display:flex;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.login-footer{text-align:center;margin-top:26px;padding-top:22px;border-top:1px dashed var(--line);font:600 11.5px var(--font);color:var(--muted);line-height:1.8}
.login-footer b{color:var(--ink-2)}
.hint-box{position:relative;background:var(--yellow-soft);border-radius:14px;padding:14px 16px;margin-bottom:24px;font:500 12.5px var(--font);color:#92400E;line-height:1.6}
.hint-box b{font-weight:800}
.hint-box code{background:rgba(146,64,14,.1);padding:1px 6px;border-radius:6px;font-size:11.5px}
/* ★ TAMBAHAN: tombol tutup hint-box */
.hint-close{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;border-radius:50%;
  background:rgba(146,64,14,.1);color:#92400E;cursor:pointer;display:grid;place-items:center}
.hint-close svg{width:13px;height:13px}
@media(max-width:480px){.login-card{padding:32px 24px 28px}}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <!-- ★ LOGO RESMI: BBWS Brantas horizontal (logo 2)
         fallback: bila file belum ada, tampil simbol (logo 3) via onerror -->
    <img id="loginLogo" src="assets/img/logo-bbws.png" alt="BBWS Brantas — Kementerian PUPR">
    <h1>Portal Pegawai</h1>
    <p>BBWS Brantas — Kementerian PUPR</p>
  </div>

  <!-- ★ PATCH: hint-box bisa ditutup + CATATAN: hapus blok ini
       di produksi (jangan paparkan format username ke publik) -->
  <div class="hint-box" id="hintBox">
    <button type="button" class="hint-close" id="hintClose" aria-label="Tutup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <b>💡 Info Login:</b><br>
    Gunakan <b>NSP/NPA/NPK</b> atau username yang diberikan admin.<br>
    Contoh: <code>NSP.05.84.15.13.027</code>
  </div>

  <div class="error-msg" id="errorMsg">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="errorText">Username atau password salah!</span>
  </div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="NSP/NPA/NPK atau username" required autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <!-- ★ TAMBAHAN: toggle lihat password -->
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Tampilkan password">
          <svg id="pwEye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn" id="btnLogin">
      <span id="btnText">Masuk</span>
    </button>
  </form>

  <div class="login-footer">
    <b>Balai Besar Wilayah Sungai Brantas</b><br>
    Direktorat Jenderal Sumber Daya Air<br>
    © <span id="yearNow">2026</span> — Versi 1.0.0
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>

<script>
// Redirect jika sudah login
if (getSession()) window.location.href = 'app.html';

// ★ TAMBAHAN: tahun footer otomatis
document.getElementById('yearNow').textContent = new Date().getFullYear();

// ★ TAMBAHAN: fallback logo — bila logo-bbws.png belum tersedia,
// pakai simbol (logo 3); bila itu pun gagal, sembunyikan img
const loginLogo = document.getElementById('loginLogo');
loginLogo.addEventListener('error', () => {
  if (!loginLogo.dataset.fb) {
    loginLogo.dataset.fb = '1';
    loginLogo.src = 'assets/img/logo-symbol.png';
  } else {
    loginLogo.style.display = 'none';
  }
});

// ★ TAMBAHAN: tutup hint-box
document.getElementById('hintClose')?.addEventListener('click', () => {
  document.getElementById('hintBox').style.display = 'none';
});

// ★ TAMBAHAN: toggle lihat password
const pwInput = document.getElementById('password');
const pwToggle = document.getElementById('pwToggle');
const pwEye = document.getElementById('pwEye');
pwToggle.addEventListener('click', () => {
  const show = pwInput.type === 'password';
  pwInput.type = show ? 'text' : 'password';
  pwToggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  pwEye.innerHTML = show
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

// ★ PATCH: autofocus hanya di desktop — di HP autofocus memunculkan
// keyboard yang menutupi logo sejak halaman dibuka
if (window.matchMedia('(min-width: 481px)').matches) {
  document.getElementById('username').focus();
}

// Handle form login
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('btnLogin');
  const btnText = document.getElementById('btnText');
  const errorMsg = document.getElementById('errorMsg');
  const errorText = document.getElementById('errorText');

  if (!username || !password) {
    errorText.textContent = 'Username dan password wajib diisi';
    errorMsg.classList.add('show');
    return;
  }

  // Reset
  errorMsg.classList.remove('show');
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> Memproses...';

  // Login
  const result = await login(username, password);

  if (result.success) {
    btnText.textContent = 'Berhasil! Mengalihkan...';
    setTimeout(() => window.location.href = 'app.html', 500);
  } else {
    errorText.textContent = result.message;
    errorMsg.classList.add('show');
    btn.disabled = false;
    btnText.textContent = 'Masuk';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
});
</script>
</body>
</html>
